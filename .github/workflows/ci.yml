name: Windows preview CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      upload_release_artifacts:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Frozen install
        run: bun install --frozen-lockfile

      - name: Build SDK
        run: bun run build:sdk

      - name: Typecheck CLI
        working-directory: apps/cli
        run: bun run typecheck

      - name: Test Windows preview source surface
        run: >-
          bun -F @cline/cli test:unit
          src/shri/
          src/main.test.ts
          src/commands/auth.test.ts
          src/commands/update.test.ts
          src/commands/program.test.ts
          src/commands/bin-wrapper.test.ts
          src/commands/distribution-package.test.ts
          src/commands/package-release.test.ts
          src/commands/release-artifacts.test.ts
          src/commands/publish-inputs.test.ts
          src/runtime/prompt.test.ts
          src/runtime/run-agent.test.ts
          src/tui/index.test.ts

      - name: Build native Windows CLI
        working-directory: apps/cli
        run: bun run build:platforms:single

      - name: Generate Windows-only npm packages
        working-directory: apps/cli
        run: bun run package:release --target windows-x64

      - name: Verify exact npm tarballs
        working-directory: apps/cli
        run: bun run verify:release --target windows-x64

      - name: Test clean installed tarballs
        id: installed_smoke
        working-directory: apps/cli
        run: bun run test:e2e src/commands/installed-release.e2e.test.ts

      - name: Diagnose failed installed smoke processes
        if: failure() && steps.installed_smoke.outcome == 'failure'
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process |
            Where-Object { $_.ProcessId -ne $PID -and ($_.CommandLine -like '*shri-installed-*' -or $_.Name -eq 'shri.exe') } |
            ForEach-Object {
              # Windows compiled Bun embeds entries under B:/~BUN/root, so the
              # hub daemon never receives --cline-hub-daemon here; print the
              # redacted command line instead of inferring from that marker.
              $cmd = ($_.CommandLine -replace '(?i)((?:key|token|secret)\S*[= ]+)\S+', '$1<redacted>')
              $parent = Get-CimInstance Win32_Process -Filter "ProcessId=$($_.ParentProcessId)" -ErrorAction SilentlyContinue
              $parentInfo = if ($parent) { "$($parent.Name) created=$($parent.CreationDate.ToUniversalTime().ToString('o'))" } else { 'exited' }
              Write-Output "$($_.Name) pid=$($_.ProcessId) created=$($_.CreationDate.ToUniversalTime().ToString('o')) parent=$($_.ParentProcessId) parentState=$parentInfo path=$($_.ExecutablePath)"
              Write-Output "  cmd=$cmd"
            }
          Get-ChildItem -Path $env:TEMP -Directory -Filter 'shri-installed-*' -ErrorAction SilentlyContinue |
            ForEach-Object {
              $root = $_.FullName
              Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
                Select-Object -First 40 |
                ForEach-Object { Write-Output "leftover $($_.FullName.Substring($root.Length))" }
            }

      - name: Check publish input integrity
        shell: pwsh
        run: |
          $version = (Get-Content apps/cli/package.json | ConvertFrom-Json).version
          node apps/cli/script/check-publish-inputs.mjs --report apps/cli/dist/npm/verification-report.json --version $version --target windows-x64 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Publish input check failed" }

      - name: Upload tested release tarballs
        if: ${{ inputs.upload_release_artifacts == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shri-windows-x64-${{ github.sha }}
          path: |
            apps/cli/dist/npm/tarballs/*.tgz
            apps/cli/dist/npm/verification-report.json
          if-no-files-found: error
          compression-level: 0
