name: Windows preview release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified tarballs to npm next (requires trusted publishing)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the approved repo and exact version tag
        run: |
          node -e "const v=require('./apps/cli/package.json').version; if (process.env.GITHUB_REPOSITORY !== 'shrinivas-sn/shri-harness' || process.env.GITHUB_REF !== 'refs/tags/v'+v || !/^\\d+\\.\\d+\\.\\d+-next\\.\\d+$/.test(v)) process.exit(1)"

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      upload_release_artifacts: true
    permissions:
      contents: read

  publish:
    needs: verify
    if: ${{ inputs.publish == true }}
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm CLI with trusted publishing support
        run: npm install -g npm@11.5.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shri-windows-x64-${{ github.sha }}
          path: apps/cli/dist/npm

      - name: Publish verified Windows package then wrapper
        shell: pwsh
        run: |
          $version = (Get-Content apps/cli/package.json | ConvertFrom-Json).version
          $plan = node apps/cli/script/check-publish-inputs.mjs --report apps/cli/dist/npm/verification-report.json --version $version --target windows-x64 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $plan.Count -ne 2) { throw "Invalid release artifact plan" }
          foreach ($item in $plan) {
            npm publish $item.path --tag next --access public --provenance --ignore-scripts --offline=false
            if ($LASTEXITCODE -ne 0) { throw "npm publish failed for $($item.name); stop and reconcile registry state" }
          }
